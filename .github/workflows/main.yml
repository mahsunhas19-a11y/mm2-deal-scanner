name: MM2 Deal Scan

on:
  schedule:
    # Alle 30 Minuten, leicht versetzt gegen GitHub-Auslastung.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mm2-deal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MM2_HEADLESS: "1"
      MM2_LOLGA_HEADED: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Projekt laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tests ausführen
        run: python -m unittest -v

      - name: Alle Shops scannen
        run: |
          mkdir -p scan_results
          xvfb-run -a python main.py 2>&1 | tee scan_results/latest_run.log

      - name: Ergebnisse als Download sichern
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mm2-scan-${{ github.run_number }}
          path: scan_results/
          if-no-files-found: warn
          retention-days: 30

      - name: Top-300-CSV im Repository aktualisieren
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scan_results/top_300_deals.csv
          if git diff --cached --quiet; then
            echo "Keine Preisänderung."
          else
            git commit -m "Update MM2 Top-300 deals"
            git push
          fi

      - name: Discord benachrichtigen
        if: ${{ always() }}
        env:
          DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/1535421147561070673/4Kwc7JKhGMZK3Wmm8SbhvCid3Th_OrQuzWj2lvIPpiMu5m-oOv3YWV7d8ZNphihem2jj"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python discord_notify.py
